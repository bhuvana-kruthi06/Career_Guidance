server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 7m;

    location /api/ {
        proxy_pass http://backend:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Always serve the SPA entry point for client-side routes such as /login
    # and /admin/login. Keep index.html fresh so browsers don't retain a
    # previous frontend bundle after a container rebuild.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
